<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>穿搭评分</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC",sans-serif;background:#f5f0eb;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border-radius:16px;padding:32px 24px;max-width:400px;width:100%;box-shadow:0 2px 12px rgba(0,0,0,.06);text-align:center}
h2{font-size:20px;color:#333;margin-bottom:8px}
.info{color:#999;font-size:13px;margin-bottom:24px;line-height:1.6}
.stars{display:flex;justify-content:center;gap:24px;margin:24px 0}
.star-btn{display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;padding:12px;border-radius:12px;border:2px solid transparent;transition:.2s;background:none;font-family:inherit}
.star-btn:hover{border-color:#d4a574;background:#fdf8f3}
.star-btn .emoji{font-size:40px}
.star-btn .label{font-size:12px;color:#888}
.star-btn.selected{border-color:#d4a574;background:#fdf8f3}
.star-btn.selected .label{color:#8b7355;font-weight:600}
.form2{display:none;margin-top:20px;text-align:left}
.form2.show{display:block}
.form2 h3{font-size:15px;color:#555;margin-bottom:12px}
.form2 label{display:block;padding:10px 14px;margin:6px 0;border:1px solid #eee;border-radius:8px;cursor:pointer;font-size:14px;color:#555}
.form2 label:hover{background:#fdf8f3}
.form2 input[type=radio]{margin-right:8px}
.form2 textarea{width:100%;margin-top:10px;padding:10px;border:1px solid #e0d5c5;border-radius:8px;font-size:14px;resize:none;height:60px;font-family:inherit}
.submit-btn{display:block;width:100%;margin-top:20px;padding:14px;background:#8b7355;color:#fff;border:none;border-radius:10px;font-size:16px;cursor:pointer;letter-spacing:1px}
.submit-btn:active{opacity:.8}
.submit-btn:disabled{background:#ccc}
#done{display:none}
#done.show{display:block}
#done h1{font-size:48px;margin-bottom:12px}
#done p{color:#999;font-size:14px}
#msg{color:#c0392b;font-size:13px;margin-top:8px;display:none}
</style>
</head>
<body>
<div class="card">
  <div id="rating-form">
    <h2>这套穿搭怎么样？</h2>
    <div class="info" id="outfit-info">加载中…</div>

    <div class="stars" id="stars">
      <button class="star-btn" onclick="selectRating(1)">
        <span class="emoji">⭐</span>
        <span class="label">失望</span>
      </button>
      <button class="star-btn" onclick="selectRating(2)">
        <span class="emoji">⭐⭐</span>
        <span class="label">一般</span>
      </button>
      <button class="star-btn" onclick="selectRating(3)">
        <span class="emoji">⭐⭐⭐</span>
        <span class="label">满意</span>
      </button>
    </div>

    <div class="form2" id="form2">
      <h3>哪里不满意？</h3>
      <label><input type="radio" name="reason" value="style_mismatch"> 风格不匹配</label>
      <label><input type="radio" name="reason" value="scene_mismatch"> 场景不适用</label>
      <label><input type="radio" name="reason" value="combo_dislike"> 搭配不喜欢</label>
      <label><input type="radio" name="reason" value="item_issue"> 单品不合适</label>
      <textarea id="note" placeholder="补充说明（可选）"></textarea>
    </div>

    <p id="msg"></p>
    <button class="submit-btn" id="submit-btn" disabled onclick="submit()">提交评分</button>
  </div>

  <div id="done">
    <h1 id="done-emoji"></h1>
    <p id="done-msg"></p>
  </div>
</div>

<script>
const urlParams = new URLSearchParams(window.location.search);
const outfitId = urlParams.get('id') || 'unknown';
let selectedRating = 0;

// Show outfit info
fetch('/api/outfit/' + outfitId)
  .then(r => r.json())
  .then(d => {
    let items = (d.items||[]).map(i => i.id+' '+i.name).join('<br>');
    document.getElementById('outfit-info').innerHTML =
      '<b>'+d.outfit+'</b><br>'+d.style+' · '+d.date+'<br>'+items;
  })
  .catch(() => {
    document.getElementById('outfit-info').innerHTML = '<b>'+outfitId+'</b>';
  });

function selectRating(n) {
  selectedRating = n;
  document.querySelectorAll('.star-btn').forEach(b => b.classList.remove('selected'));
  event.target.closest('.star-btn').classList.add('selected');
  document.getElementById('form2').classList.toggle('show', n === 1);
  document.getElementById('msg').style.display = 'none';
  document.getElementById('submit-btn').disabled = false;
}

function submit() {
  if (selectedRating === 0) { showMsg('请先选择评分'); return; }
  if (selectedRating === 1) {
    let reason = document.querySelector('input[name=reason]:checked');
    if (!reason) { showMsg('请选择不满意的原因'); return; }
  }

  let data = {
    outfit_id: outfitId,
    rating: selectedRating,
    rated_at: new Date().toISOString()
  };

  if (selectedRating === 1) {
    let reason = document.querySelector('input[name=reason]:checked');
    data.feedback = {
      reason: reason.value,
      detail: document.getElementById('note').value || ''
    };
  }

  fetch('/rate', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(data)
  })
  .then(r => r.json())
  .then(res => {
    if (res.status === 'ok') {
      document.getElementById('rating-form').style.display = 'none';
      let d = document.getElementById('done');
      d.classList.add('show');
      let emojis = {1:'💔',2:'🤔',3:'❤️'};
      let msgs = {1:'已记录，以后减少这类推荐',2:'已记录，我们会分析改进',3:'感谢！会多推荐这类风格'};
      document.getElementById('done-emoji').textContent = emojis[selectedRating]||'✅';
      document.getElementById('done-msg').textContent = msgs[selectedRating]||'评分已记录';
    } else {
      showMsg(res.error || '提交失败');
    }
  })
  .catch(e => {
    showMsg('网络错误，请重试');
  });
}

function showMsg(m) {
  let el = document.getElementById('msg');
  el.textContent = m;
  el.style.display = 'block';
}
</script>
</body>
</html>
