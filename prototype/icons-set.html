:root{--n:#1e3a5f;--m:#94a3b5;--c:#fff;--t:#1a2838}

.w{width:440px}h2{font-size:13px;color:var(--t);margin:20px 0 8px;font-weight:700}
.g{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.cell{background:var(--c);border-radius:10px;padding:12px 4px;text-align:center;box-shadow:0 1px 3px rgba(30,58,95,.04)}
.cell svg{width:24px;height:24px;display:block;margin:0 auto 4px}
.cell .l{font-size:9px;color:var(--t);font-weight:500}
.bar{display:flex;justify-content:space-around;background:rgba(30,58,95,.92);backdrop-filter:blur(20px);border-radius:18px;padding:6px 8px;margin-top:16px;box-shadow:0 8px 32px rgba(30,58,95,.25)}
.tb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;border-radius:14px;min-width:48px}
.tb svg{width:20px;height:20px}.tb .l2{font-size:10px;font-weight:500}
.tb.off svg{color:rgba(255,255,255,.5)}.tb.off .l2{color:rgba(255,255,255,.5)}
.tb.on{background:rgba(255,255,255,.15)}.tb.on svg{color:#fff}.tb.on .l2{color:#fff;font-weight:600}
