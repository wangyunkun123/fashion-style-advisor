<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=400,initial-scale=1"><title>B - 城市机能</title>
<style>*{margin:0;padding:0;box-sizing:border-box}
body{display:flex;justify-content:center;background:#e0e0e0}
#app{width:400px;min-height:100vh;background:#fff;font-family:-apple-system,'PingFang SC',sans-serif}
.header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid #eee}
.header h1{font-size:16px;font-weight:800;letter-spacing:-.5px}
.header .icon{width:32px;height:32px;background:#111;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px}
.tabs{display:flex;padding:12px 16px 0;gap:8px}
.tab{padding:8px 16px;border-radius:20px;font-size:13px;font-weight:600;background:#f5f5f5;color:#888}
.tab.on{background:#111;color:#fff}
.main-img{width:100%;aspect-ratio:1/1;background:#f0f0f0;display:flex;align-items:center;justify-content:center;color:#ccc;font-size:90px;margin-top:12px}
.main-body{padding:16px}
.main-style{font-size:20px;font-weight:800;letter-spacing:-.5px;margin-bottom:4px}
.main-meta{font-size:12px;color:#999;margin-bottom:12px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px}
.tag{padding:6px 12px;background:#f5f5f5;border-radius:6px;font-size:12px;color:#555;font-weight:500}
.section-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#aaa;padding:0 16px 10px}
.cards{display:flex;gap:8px;padding:0 16px 20px}
.card{flex:1;background:#fafafa;border-radius:8px;padding:14px}
.card .c-title{font-size:13px;font-weight:700;margin-bottom:4px}
.card .c-items{font-size:10px;color:#999;line-height:1.5}
.bar{display:flex;justify-content:space-around;background:#111;padding:10px 0 20px}
.bar .b-tab{text-align:center;font-size:9px;color:#666;display:flex;flex-direction:column;align-items:center;gap:3px}
.bar .b-tab.on{color:#a4d037}
.bar .b-tab .ic{font-size:18px}
#app input{width:calc(100% - 32px);margin:0 16px 12px;padding:14px 16px;border:none;border-radius:24px;background:#f5f5f5;font-size:14px;color:#333;outline:none}
</style></head><body><div id="app">
<div class="header"><h1>穿搭助手</h1><div class="icon">&#x2630;</div></div>
<div class="tabs"><div class="tab on">今日推荐</div><div class="tab">历史推荐</div></div>
<div class="main-img">&#x1f455;</div>
<div class="main-body"><div class="main-style">清爽雾天城市休闲</div><div class="main-meta">2026/06/15 &middot; 雾 &middot; 22C</div>
<div class="tags"><div class="tag">TS-011 落肩T恤</div><div class="tag">SH-004 休闲短裤</div><div class="tag">SHOE-005 网球鞋</div><div class="tag">HAT-004 棒球帽</div></div></div>
<div class="section-title">// 其他推荐</div>
<div class="cards"><div class="card"><div class="c-title">夏日度假</div><div class="c-items">TS-008 / SH-008</div></div><div class="card"><div class="c-title">衬衫叠穿</div><div class="c-items">SHIRT-002 / TS-011</div></div><div class="card" style="display:flex;align-items:center;justify-content:center;border:2px dashed #ddd;background:transparent"><div style="color:#bbb;font-size:20px">+</div></div></div>
<input placeholder="输入需求...">
<div class="bar"><div class="b-tab on"><span class="ic">&#x1f455;</span>推荐</div><div class="b-tab"><span class="ic">&#x1f4a1;</span>探索</div><div class="b-tab"><span class="ic">&#x1f3e0;</span>衣橱</div><div class="b-tab"><span class="ic">&#x1f4f8;</span>添加</div><div class="b-tab"><span class="ic">&#x1f464;</span>我的</div></div>
</div></body></html>
