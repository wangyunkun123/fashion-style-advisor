<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=420"><title>Icon Preview</title>
<style>
:root{--navy:#1e3a5f;--muted:#94a3b5;--bg:#f8fafc;--card:#fff;--text:#1a2838}
body{font-family:-apple-system,sans-serif;background:#e2e6ec;display:flex;justify-content:center;padding:20px}
.container{width:400px}
h2{font-size:15px;color:var(--text);margin:24px 0 12px;letter-spacing:-.3px}
/* Preview: icons in a row */
.icon-row{display:flex;gap:0;background:var(--card);border-radius:14px;padding:8px 4px;box-shadow:0 2px 12px rgba(30,58,95,.06)}
.icon-cell{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;cursor:pointer;border-radius:12px;transition:all .2s}
.icon-cell:hover{background:#f0f4f9}
.icon-cell svg{width:22px;height:22px}
.icon-cell .label{font-size:10px;font-weight:500}
/* Grid view */
.grid{display:flex;gap:12px;flex-wrap:wrap}
.grid-card{background:var(--card);border-radius:12px;padding:20px;text-align:center;box-shadow:0 2px 8px rgba(30,58,95,.04);min-width:80px;flex:1}
.grid-card svg{width:32px;height:32px;margin-bottom:8px}
.grid-card .name{font-size:11px;font-weight:600;color:var(--text);margin-bottom:4px}
.grid-card .states{display:flex;gap:12px;justify-content:center;margin-top:8px}
.state{text-align:center}
.state .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-bottom:2px}
.state .label{font-size:9px;color:var(--muted)}
/* Tab bar mock */
.tab-bar{
  display:flex;justify-content:space-around;
  background:rgba(30,58,95,.92);backdrop-filter:blur(20px);
  border-radius:18px;padding:6px 8px;box-shadow:0 8px 32px rgba(30,58,95,.25);
  margin-top:16px;
}
.tb-tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;border-radius:14px;cursor:pointer;transition:all .25s;min-width:56px}
.tb-tab svg{width:20px;height:20px}
.tb-tab .label{font-size:10px;font-weight:500;transition:color .25s}
.tb-tab.off svg{color:rgba(255,255,255,.5)}
.tb-tab.off .label{color:rgba(255,255,255,.5)}
.tb-tab.on{background:rgba(255,255,255,.15)}
.tb-tab.on svg{color:#fff}
.tb-tab.on .label{color:#fff;font-weight:600}
</style></head><body><div class="container">

  <div style="color:var(--muted);margin-top:4px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M7.5 7.5l2.8 2.8M13.7 13.7l2.8 2.8M16.5 7.5l-2.8 2.8M10.3 13.7l-2.8 2.8"/></svg></div>

</div><div class="grid-card">

    <div class="state"><div class="dot" style="background:var(--muted)"></div><div>默认</div></div>
  </div>
</div><div class="grid-card">

  <div style="color:var(--muted);margin-top:4px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M5 21c0-4 3-7 7-7s7 3 7 7"/></svg></div>
  <div class="name">我的</div>
  <div class="states">
    <div class="state"><div class="dot" style="background:var(--navy)"></div><div>选中</div></div>
    <div class="state"><div class="dot" style="background:var(--muted)"></div><div>默认</div></div>
  </div>
</div></div>
